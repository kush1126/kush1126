<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="350px">
  <defs>
    <!-- Gradients for Sky and Land -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="100%" stop-color="#E0F7FA" />
    </linearGradient>

    <linearGradient id="grassFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#71B533" />
      <stop offset="100%" stop-color="#558B2F" />
    </linearGradient>

    <linearGradient id="grassMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BC34A" />
      <stop offset="100%" stop-color="#689F38" />
    </linearGradient>

    <linearGradient id="grassBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AED581" />
      <stop offset="100%" stop-color="#7CB342" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes hover {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .nametag { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #FFFFFF; font-weight: bold; }
      .tag-bg { fill: #000000; opacity: 0.6; rx: 4; }
      .tag-border { fill: none; stroke: #FFFFFF; stroke-width: 1; opacity: 0.3; rx: 4; }
      .hover-element { animation: hover 4s infinite ease-in-out; }
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: 1s; }
      .d3 { animation-delay: 2s; }
      .d4 { animation-delay: 3s; }
      
      /* Project specific */
      .village-wood { fill: #A0522D; }
      .village-roof { fill: #8B4513; }
      .village-stone { fill: #A9A9A9; }
      
      .castle-stone { fill: #708090; }
      .castle-dark { fill: #2F4F4F; }
      
      .ancient-dark { fill: #1A1A1A; }
      .ancient-cyan { fill: #00FFFF; }
      
      .outpost-wood { fill: #3E2723; }
      .outpost-wool { fill: #F5F5DC; }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="800" height="350" fill="url(#sky)" />

  <!-- Clouds (blocky) -->
  <g fill="#FFFFFF" opacity="0.8">
    <rect x="50" y="30" width="80" height="20" />
    <rect x="70" y="20" width="40" height="10" />
    <rect x="60" y="50" width="60" height="10" />

    <rect x="600" y="60" width="100" height="25" />
    <rect x="620" y="45" width="50" height="15" />
    <rect x="580" y="85" width="80" height="10" />
    
    <rect x="350" y="40" width="70" height="15" />
    <rect x="370" y="30" width="30" height="10" />
  </g>

  <!-- Sun -->
  <rect x="700" y="20" width="40" height="40" fill="#FFEB3B" />

  <!-- Background Hills -->
  <path d="M 0,220 Q 200,160 400,220 T 800,180 L 800,350 L 0,350 Z" fill="url(#grassBack)" />
  
  <!-- Midground Hills -->
  <path d="M 0,260 Q 300,200 500,270 T 800,230 L 800,350 L 0,350 Z" fill="url(#grassMid)" />
  
  <!-- Foreground Hills -->
  <path d="M 0,300 Q 200,260 400,310 T 800,280 L 800,350 L 0,350 Z" fill="url(#grassFront)" />

  <!-- STRUCTURE 1: Bunk Buddy (Outpost) - Back Left -->
  <g transform="translate(80, 160)">
    <!-- Base -->
    <rect x="10" y="40" width="40" height="30" class="outpost-wood" />
    <!-- Pillars -->
    <rect x="5" y="10" width="10" height="60" class="outpost-wood" />
    <rect x="45" y="10" width="10" height="60" class="outpost-wood" />
    <!-- Tent/Roof -->
    <polygon points="0,10 30,-20 60,10" class="outpost-wood" />
    <polygon points="5,10 30,-15 55,10" class="outpost-wool" />
    <!-- Flags -->
    <rect x="30" y="-30" width="2" height="10" class="outpost-wood" />
    <polygon points="32,-30 45,-25 32,-20" fill="#8B0000" />
    
    <!-- Nametag -->
    <g transform="translate(30, -50)" class="hover-element d1">
      <rect x="-55" y="-15" width="110" height="24" class="tag-bg" />
      <rect x="-55" y="-15" width="110" height="24" class="tag-border" />
      <text x="0" y="2" class="nametag" text-anchor="middle">Bunk Buddy</text>
    </g>
  </g>

  <!-- STRUCTURE 2: R Square Services (Castle) - Mid Right -->
  <g transform="translate(600, 150)">
    <!-- Main Wall -->
    <rect x="10" y="30" width="80" height="50" class="castle-stone" />
    <!-- Left Tower -->
    <rect x="0" y="10" width="20" height="70" class="castle-stone" />
    <rect x="-2" y="0" width="24" height="10" class="castle-dark" />
    <rect x="-4" y="-10" width="28" height="10" class="castle-stone" />
    <!-- Left Crenellations -->
    <rect x="-4" y="-15" width="6" height="5" class="castle-stone" />
    <rect x="6" y="-15" width="6" height="5" class="castle-stone" />
    <rect x="16" y="-15" width="6" height="5" class="castle-stone" />
    <!-- Right Tower -->
    <rect x="80" y="10" width="20" height="70" class="castle-stone" />
    <rect x="78" y="0" width="24" height="10" class="castle-dark" />
    <rect x="76" y="-10" width="28" height="10" class="castle-stone" />
    <!-- Right Crenellations -->
    <rect x="76" y="-15" width="6" height="5" class="castle-stone" />
    <rect x="86" y="-15" width="6" height="5" class="castle-stone" />
    <rect x="96" y="-15" width="6" height="5" class="castle-stone" />
    <!-- Gate -->
    <path d="M 35,80 L 35,50 A 15,15 0 0,1 65,50 L 65,80 Z" fill="#2E1A11" />
    
    <!-- Nametag -->
    <g transform="translate(50, -40)" class="hover-element d2">
      <rect x="-70" y="-15" width="140" height="24" class="tag-bg" />
      <rect x="-70" y="-15" width="140" height="24" class="tag-border" />
      <text x="0" y="2" class="nametag" text-anchor="middle">R Square Services</text>
    </g>
  </g>

  <!-- STRUCTURE 3: FlowMind (Ancient City) - Front Right (Cave entrance/dark structure) -->
  <g transform="translate(400, 200)">
    <!-- Base Structure -->
    <rect x="0" y="30" width="90" height="50" class="ancient-dark" />
    <!-- Portal/Centerpiece -->
    <rect x="30" y="10" width="30" height="70" class="ancient-dark" />
    <rect x="35" y="15" width="20" height="65" fill="#0D0D0D" />
    <rect x="37" y="17" width="16" height="63" class="ancient-cyan" opacity="0.8" filter="url(#shadow)" />
    <!-- Accents -->
    <rect x="10" y="40" width="10" height="10" class="ancient-cyan" />
    <rect x="70" y="40" width="10" height="10" class="ancient-cyan" />
    <!-- Broken Pillars -->
    <rect x="-15" y="50" width="15" height="30" class="ancient-dark" />
    <rect x="90" y="60" width="15" height="20" class="ancient-dark" />
    
    <!-- Nametag -->
    <g transform="translate(45, -20)" class="hover-element d3">
      <rect x="-45" y="-15" width="90" height="24" class="tag-bg" />
      <rect x="-45" y="-15" width="90" height="24" class="tag-border" />
      <text x="0" y="2" class="nametag" text-anchor="middle">FlowMind</text>
    </g>
  </g>

  <!-- STRUCTURE 4: KYP Pharma (Village) - Front Left -->
  <g transform="translate(180, 220)">
    <!-- House 1 -->
    <rect x="0" y="20" width="40" height="35" class="village-wood" />
    <polygon points="-5,20 20,0 45,20" class="village-roof" />
    <rect x="15" y="35" width="10" height="20" fill="#5C4033" />
    <rect x="5" y="30" width="8" height="8" fill="#87CEEB" />
    
    <!-- House 2 (Slightly behind) -->
    <rect x="45" y="10" width="50" height="45" class="village-wood" />
    <rect x="45" y="10" width="50" height="45" fill="#000" opacity="0.2" /> <!-- shadow -->
    <polygon points="40,10 70,-15 100,10" class="village-roof" />
    <rect x="65" y="35" width="12" height="20" fill="#5C4033" />
    <rect x="50" y="20" width="10" height="10" fill="#87CEEB" />
    <rect x="80" y="20" width="10" height="10" fill="#87CEEB" />
    
    <!-- Well/Farm -->
    <rect x="-30" y="40" width="20" height="15" class="village-stone" />
    <rect x="-30" y="42" width="20" height="10" fill="#3A82F8" />
    
    <!-- Nametag -->
    <g transform="translate(45, -35)" class="hover-element d4">
      <rect x="-50" y="-15" width="100" height="24" class="tag-bg" />
      <rect x="-50" y="-15" width="100" height="24" class="tag-border" />
      <text x="0" y="2" class="nametag" text-anchor="middle">KYP Pharma</text>
    </g>
  </g>

</svg>
