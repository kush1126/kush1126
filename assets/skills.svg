<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="320">
  <defs>
    <style>
      @keyframes fillBar {
        from { width: 0; }
      }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes glow {
        0%,100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .label { font-family: 'Courier New', monospace; font-size: 13px; fill: #CCCCCC; }
      .skill-name { font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #FFFFFF; }
      .section-title { font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; fill: #FFFF55; }
      .pct { font-family: 'Courier New', monospace; font-size: 12px; fill: #AAAAAA; }
      .icon-float { animation: float 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#121212" rx="8"/>
  <rect width="800" height="320" fill="none" stroke="#555" stroke-width="3" rx="8"/>
  <path d="M 0,0 L 800,0 L 796,4 L 4,4 Z" fill="#888888" rx="4" opacity="0.5"/>
  <path d="M 0,0 L 4,4 L 4,316 L 0,320 Z" fill="#888888" opacity="0.5"/>
  <path d="M 800,320 L 0,320 L 4,316 L 796,316 Z" fill="#000" opacity="0.5"/>
  <path d="M 800,320 L 796,316 L 796,4 L 800,0 Z" fill="#000" opacity="0.5"/>

  <!-- Title -->
  <text x="400" y="38" class="section-title" text-anchor="middle">⚔️  SKILL TREE  ⚔️</text>
  <line x1="40" y1="48" x2="760" y2="48" stroke="#555" stroke-width="2"/>

  <!-- ===== LEFT COLUMN ===== -->

  <!-- JavaScript -->
  <g transform="translate(40, 70)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float">🟨</text>
    <text x="32" y="-2" class="skill-name">JavaScript</text>
    <text x="302" y="-2" class="pct">92%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#39F547" rx="2">
      <animate attributeName="width" from="0" to="258" dur="1.5s" fill="freeze" begin="0s"/>
    </rect>
    <rect x="32" y="6" width="258" height="4" fill="#88FFA1" rx="2" opacity="0.5"/>
  </g>

  <!-- React -->
  <g transform="translate(40, 115)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float" style="animation-delay:0.3s">⚛️</text>
    <text x="32" y="-2" class="skill-name">React.js</text>
    <text x="302" y="-2" class="pct">88%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#61DAFB" rx="2">
      <animate attributeName="width" from="0" to="246" dur="1.5s" fill="freeze" begin="0.2s"/>
    </rect>
    <rect x="32" y="6" width="246" height="4" fill="#A8EDFC" rx="2" opacity="0.5"/>
  </g>

  <!-- Node.js -->
  <g transform="translate(40, 160)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float" style="animation-delay:0.6s">🟩</text>
    <text x="32" y="-2" class="skill-name">Node.js</text>
    <text x="302" y="-2" class="pct">85%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#68A063" rx="2">
      <animate attributeName="width" from="0" to="238" dur="1.5s" fill="freeze" begin="0.4s"/>
    </rect>
    <rect x="32" y="6" width="238" height="4" fill="#90C080" rx="2" opacity="0.5"/>
  </g>

  <!-- Python -->
  <g transform="translate(40, 205)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float" style="animation-delay:0.9s">🐍</text>
    <text x="32" y="-2" class="skill-name">Python</text>
    <text x="302" y="-2" class="pct">82%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#FFD43B" rx="2">
      <animate attributeName="width" from="0" to="230" dur="1.5s" fill="freeze" begin="0.6s"/>
    </rect>
    <rect x="32" y="6" width="230" height="4" fill="#FFE87A" rx="2" opacity="0.5"/>
  </g>

  <!-- TypeScript -->
  <g transform="translate(40, 250)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float" style="animation-delay:1.2s">🔷</text>
    <text x="32" y="-2" class="skill-name">TypeScript</text>
    <text x="302" y="-2" class="pct">80%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#3178C6" rx="2">
      <animate attributeName="width" from="0" to="224" dur="1.5s" fill="freeze" begin="0.8s"/>
    </rect>
    <rect x="32" y="6" width="224" height="4" fill="#6BA4E0" rx="2" opacity="0.5"/>
  </g>

  <!-- Divider -->
  <line x1="400" y1="55" x2="400" y2="300" stroke="#333" stroke-width="2"/>

  <!-- ===== RIGHT COLUMN ===== -->

  <!-- MongoDB -->
  <g transform="translate(420, 70)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float" style="animation-delay:0.15s">🍃</text>
    <text x="32" y="-2" class="skill-name">MongoDB</text>
    <text x="302" y="-2" class="pct">80%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#47A248" rx="2">
      <animate attributeName="width" from="0" to="224" dur="1.5s" fill="freeze" begin="0.3s"/>
    </rect>
    <rect x="32" y="6" width="224" height="4" fill="#7DC87D" rx="2" opacity="0.5"/>
  </g>

  <!-- Next.js -->
  <g transform="translate(420, 115)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float" style="animation-delay:0.45s">▲</text>
    <text x="32" y="-2" class="skill-name">Next.js</text>
    <text x="302" y="-2" class="pct">78%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#FFFFFF" rx="2">
      <animate attributeName="width" from="0" to="218" dur="1.5s" fill="freeze" begin="0.5s"/>
    </rect>
    <rect x="32" y="6" width="218" height="4" fill="#CCCCCC" rx="2" opacity="0.5"/>
  </g>

  <!-- SQL -->
  <g transform="translate(420, 160)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float" style="animation-delay:0.75s">🗄️</text>
    <text x="32" y="-2" class="skill-name">SQL / DB</text>
    <text x="302" y="-2" class="pct">75%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#FF8C00" rx="2">
      <animate attributeName="width" from="0" to="210" dur="1.5s" fill="freeze" begin="0.7s"/>
    </rect>
    <rect x="32" y="6" width="210" height="4" fill="#FFB55A" rx="2" opacity="0.5"/>
  </g>

  <!-- AI / ML -->
  <g transform="translate(420, 205)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float" style="animation-delay:1.05s">🤖</text>
    <text x="32" y="-2" class="skill-name">AI / ML</text>
    <text x="302" y="-2" class="pct">72%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#A855F7" rx="2">
      <animate attributeName="width" from="0" to="202" dur="1.5s" fill="freeze" begin="0.9s"/>
    </rect>
    <rect x="32" y="6" width="202" height="4" fill="#CC99FF" rx="2" opacity="0.5"/>
  </g>

  <!-- Docker -->
  <g transform="translate(420, 250)">
    <text x="0" y="0" font-family="Segoe UI Emoji,sans-serif" font-size="22" class="icon-float" style="animation-delay:1.35s">🐳</text>
    <text x="32" y="-2" class="skill-name">Docker</text>
    <text x="302" y="-2" class="pct">65%</text>
    <rect x="32" y="6" width="280" height="12" fill="#1A1A1A" rx="2"/>
    <rect x="32" y="6" width="1" height="12" fill="#2496ED" rx="2">
      <animate attributeName="width" from="0" to="182" dur="1.5s" fill="freeze" begin="1.1s"/>
    </rect>
    <rect x="32" y="6" width="182" height="4" fill="#70BFFF" rx="2" opacity="0.5"/>
  </g>

</svg>
