<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300px">
  <defs>
    <!-- Normal Biome Sky (Daytime) -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79A6FE" />
      <stop offset="100%" stop-color="#C6E2FF" />
    </linearGradient>

    <!-- Normal Biome Water -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F76E4" />
      <stop offset="100%" stop-color="#2D55A6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes float-delay {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(4px); }
      }
      @keyframes cloudMove {
        0% { transform: translateX(850px); }
        100% { transform: translateX(-200px); }
      }
      .cloud { animation: cloudMove 40s linear infinite; }
      .cloud.d1 { animation-duration: 30s; animation-delay: -10s; }
      .cloud.d2 { animation-duration: 50s; animation-delay: -25s; }
      
      .title-text { 
        font-family: 'Courier New', Courier, monospace; 
        font-weight: 900; 
        font-size: 58px;
        fill: #FFFFFF;
        text-shadow: 6px 6px 0px #3E3E3E, 8px 8px 0px #000;
        animation: float 4s infinite ease-in-out;
      }
      .subtitle-text {
        font-family: 'Courier New', Courier, monospace; 
        font-weight: 700;
        font-size: 20px;
        fill: #FFFF55;
        text-shadow: 2px 2px 0px #000;
        animation: float-delay 4s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="800" height="300" fill="url(#skyGrad)" />

  <!-- Blocky Sun -->
  <rect x="650" y="30" width="60" height="60" fill="#FFEB3B" opacity="0.9" />

  <!-- Blocky Clouds -->
  <g fill="#FFFFFF" opacity="0.8">
    <!-- Cloud 1 -->
    <g class="cloud">
      <rect x="50" y="40" width="100" height="20" />
      <rect x="70" y="20" width="60" height="20" />
      <rect x="60" y="60" width="80" height="10" />
    </g>
    <!-- Cloud 2 -->
    <g class="cloud d1">
      <rect x="600" y="60" width="120" height="20" />
      <rect x="620" y="80" width="80" height="20" />
      <rect x="640" y="40" width="60" height="20" />
    </g>
    <!-- Cloud 3 -->
    <g class="cloud d2">
      <rect x="350" y="30" width="80" height="15" />
      <rect x="370" y="15" width="40" height="15" />
      <rect x="340" y="45" width="100" height="10" />
    </g>
  </g>

  <!-- Mountains Layer 1 (Distant) - Blocky Style -->
  <!-- Mountain 1 -->
  <path d="M 0,230 L 0,170 L 20,170 L 20,150 L 50,150 L 50,130 L 80,130 L 80,110 L 120,110 L 120,130 L 150,130 L 150,150 L 180,150 L 180,170 L 210,170 L 210,190 L 250,190 L 250,230 Z" fill="#9E9E9E" />
  <!-- Mountain 2 -->
  <path d="M 200,230 L 200,190 L 230,190 L 230,170 L 260,170 L 260,150 L 300,150 L 300,130 L 340,130 L 340,150 L 380,150 L 380,170 L 410,170 L 410,190 L 450,190 L 450,230 Z" fill="#757575" />
  <!-- Mountain 3 -->
  <path d="M 400,230 L 400,190 L 440,190 L 440,170 L 470,170 L 470,150 L 510,150 L 510,130 L 560,130 L 560,150 L 600,150 L 600,170 L 630,170 L 630,190 L 670,190 L 670,230 Z" fill="#9E9E9E" />
  <!-- Mountain 4 -->
  <path d="M 600,230 L 600,200 L 640,200 L 640,180 L 680,180 L 680,160 L 730,160 L 730,140 L 780,140 L 780,170 L 800,170 L 800,230 Z" fill="#757575" />

  <!-- Foreground Land (Grass Dirt Blocks) -->
  <!-- Blocky terrain edge -->
  <path d="M 0,220 L 100,220 L 100,215 L 200,215 L 200,220 L 350,220 L 350,215 L 450,215 L 450,220 L 600,220 L 600,210 L 700,210 L 700,220 L 800,220 L 800,270 L 0,270 Z" fill="#7CB342" />
  <!-- Dirt layer underneath grass -->
  <path d="M 0,230 L 100,230 L 100,225 L 200,225 L 200,230 L 350,230 L 350,225 L 450,225 L 450,230 L 600,230 L 600,220 L 700,220 L 700,230 L 800,230 L 800,270 L 0,270 Z" fill="#795548" />
  
  <!-- Trees (Oak Trees) -->
  <!-- Tree 1 -->
  <g>
    <rect x="36" y="200" width="8" height="20" fill="#5D4037" /> <!-- Trunk -->
    <!-- Leaves -->
    <rect x="25" y="190" width="30" height="10" fill="#43A047" />
    <rect x="30" y="180" width="20" height="10" fill="#388E3C" />
    <rect x="35" y="170" width="10" height="10" fill="#43A047" />
  </g>
  <!-- Tree 2 -->
  <g>
    <rect x="126" y="195" width="8" height="20" fill="#5D4037" /> 
    <rect x="110" y="185" width="40" height="10" fill="#388E3C" />
    <rect x="120" y="175" width="20" height="10" fill="#43A047" />
    <rect x="125" y="165" width="10" height="10" fill="#2E7D32" />
  </g>
  <!-- Tree 3 -->
  <g>
    <rect x="716" y="190" width="8" height="20" fill="#5D4037" /> 
    <rect x="700" y="180" width="40" height="10" fill="#43A047" />
    <rect x="710" y="170" width="20" height="10" fill="#388E3C" />
    <rect x="715" y="160" width="10" height="10" fill="#2E7D32" />
  </g>

  <!-- Water Reflection at Bottom -->
  <rect x="0" y="270" width="800" height="30" fill="url(#waterGrad)" opacity="0.9"/>
  <!-- Blocky water lines -->
  <g fill="#90CAF9" opacity="0.4">
    <rect x="0" y="275" width="800" height="2" />
    <rect x="50" y="280" width="100" height="2" />
    <rect x="250" y="280" width="150" height="2" />
    <rect x="500" y="280" width="80" height="2" />
    <rect x="700" y="280" width="60" height="2" />
  </g>

  <!-- Title Section -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="400" y="120" class="title-text">KUSH MAURYA</text>
    
    <!-- Subtitle -->
    <text x="400" y="165" class="subtitle-text">Fullstack Developer · AI Engineer</text>
  </g>

</svg>
