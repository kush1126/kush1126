<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300px">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050A1F" />
      <stop offset="50%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#243B55" />
    </linearGradient>

    <!-- Aurora Gradient -->
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(34,193,195,0)" />
      <stop offset="25%" stop-color="rgba(45,253,163,0.4)" />
      <stop offset="75%" stop-color="rgba(123,47,247,0.4)" />
      <stop offset="100%" stop-color="rgba(34,193,195,0)" />
    </linearGradient>
    
    <!-- Water Gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="torchGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes float-delay {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(5px); }
      }
      @keyframes snow {
        0% { transform: translateY(-20px) translateX(0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(300px) translateX(20px); opacity: 0; }
      }
      @keyframes aurora {
        0% { transform: translateX(-50px) scaleX(1.1) skewX(10deg); opacity: 0.3; }
        100% { transform: translateX(50px) scaleX(1.2) skewX(-10deg); opacity: 0.6; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; transform: scale(1); }
        25% { opacity: 0.8; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
        75% { opacity: 0.9; transform: scale(0.98); }
      }
      .star { animation: twinkle 3s infinite ease-in-out; }
      .aurora-band { animation: aurora 10s infinite alternate ease-in-out; transform-origin: center; }
      .snow-particle { animation: snow 5s infinite linear; }
      .torch-flame { animation: flicker 0.15s infinite alternate; }
      .title-text { 
        font-family: 'Courier New', Courier, monospace; 
        font-weight: 900; 
        font-size: 58px;
        fill: #FFFFFF;
        text-shadow: 5px 5px 0px #3E3E3E, 6px 6px 0px #000;
        animation: float 4s infinite ease-in-out;
      }
      .subtitle-text {
        font-family: 'Courier New', Courier, monospace; 
        font-weight: 700;
        font-size: 20px;
        fill: #A8DADC;
        text-shadow: 2px 2px 0px #000;
        animation: float-delay 4s infinite ease-in-out;
      }
      .bracket {
        font-family: 'Courier New', monospace; 
        font-size: 45px; 
        font-weight: bold; 
        fill: #C9A6FF; 
        opacity: 0.9;
        text-shadow: 2px 2px 0px #000;
      }
      
      /* Staggered animations */
      .d1 { animation-delay: -1s; }
      .d2 { animation-delay: -2s; }
      .d3 { animation-delay: -3s; }
      .d4 { animation-delay: -4s; }
      .d5 { animation-delay: -5s; }
      .s1 { animation-duration: 4s; }
      .s2 { animation-duration: 6s; }
      .s3 { animation-duration: 3.5s; }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="800" height="300" fill="url(#skyGrad)" />

  <!-- Stars -->
  <g fill="#FFF">
    <!-- Static stars -->
    <circle cx="50" cy="50" r="1.5" opacity="0.5"/>
    <circle cx="150" cy="20" r="1"/>
    <circle cx="250" cy="80" r="2" opacity="0.6"/>
    <circle cx="350" cy="30" r="1.5"/>
    <circle cx="450" cy="90" r="1"/>
    <circle cx="650" cy="40" r="2" opacity="0.8"/>
    <circle cx="750" cy="70" r="1.5"/>
    
    <!-- Twinkling stars -->
    <circle class="star d1" cx="100" cy="90" r="1.5"/>
    <circle class="star d2" cx="200" cy="40" r="2"/>
    <circle class="star d3" cx="300" cy="110" r="1"/>
    <circle class="star d4" cx="550" cy="60" r="2"/>
    <circle class="star d1" cx="600" cy="20" r="1.5"/>
    <circle class="star d2" cx="700" cy="100" r="1"/>
    <circle class="star d5" cx="780" cy="30" r="2"/>
  </g>

  <!-- Aurora Borealis -->
  <path class="aurora-band" d="M -100,100 Q 200,10 400,120 T 900,40 L 900,150 L -100,150 Z" fill="url(#auroraGrad)" filter="url(#glow)" />
  <path class="aurora-band d2" d="M -100,120 Q 300,40 500,150 T 900,70 L 900,200 L -100,200 Z" fill="url(#auroraGrad)" opacity="0.5" filter="url(#glow)" />

  <!-- Mountains Layer 1 (Distant) -->
  <g fill="#1B263B">
    <polygon points="0,230 100,140 250,230" />
    <polygon points="150,230 300,100 450,230" />
    <polygon points="350,230 500,120 650,230" />
    <polygon points="550,230 700,90 850,230" />
  </g>

  <!-- Snow on Mountains -->
  <g fill="#E0E1DD" opacity="0.7">
    <polygon points="100,140 70,175 95,165 110,180 120,170 145,190 135,180 175,210 100,140" />
    <polygon points="300,100 270,135 290,125 310,145 320,130 350,165 330,145 300,100" />
    <polygon points="500,120 470,150 490,140 510,155 520,145 550,170 535,160 500,120" />
    <polygon points="700,90 670,125 690,115 710,135 720,120 750,155 730,135 700,90" />
  </g>

  <!-- Foreground Land/Trees -->
  <rect x="0" y="220" width="800" height="80" fill="#141E30" />
  
  <g fill="#0F1724">
    <!-- Trees left -->
    <polygon points="50,225 30,270 70,270" />
    <polygon points="50,205 35,250 65,250" />
    <polygon points="120,235 90,290 150,290" />
    <polygon points="120,215 100,270 140,270" />
    <!-- Trees right -->
    <polygon points="700,225 670,280 730,280" />
    <polygon points="700,200 680,255 720,255" />
    <polygon points="750,235 720,290 780,290" />
    <polygon points="750,215 730,270 770,270" />
  </g>
  <!-- Snow on Trees -->
  <g fill="#FFF" opacity="0.6">
    <polygon points="50,205 35,250 50,235 65,250" />
    <polygon points="120,215 100,270 120,250 140,270" />
    <polygon points="700,200 680,255 700,235 720,255" />
    <polygon points="750,215 730,270 750,250 770,270" />
  </g>

  <!-- Water Reflection at Bottom -->
  <rect x="0" y="270" width="800" height="30" fill="url(#waterGrad)" opacity="0.9"/>
  <rect x="0" y="270" width="800" height="2" fill="#457B9D" opacity="0.6"/>
  <!-- Gentle Waves -->
  <path d="M 0,278 Q 100,275 200,278 T 400,278 T 600,278 T 800,278" fill="none" stroke="#A8DADC" stroke-width="1.5" opacity="0.3" />
  <path d="M 0,288 Q 150,285 300,288 T 550,288 T 800,288" fill="none" stroke="#A8DADC" stroke-width="1" opacity="0.2" />

  <!-- Snow Particles Layer 1 -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle class="snow-particle s1 d1" cx="40" cy="0" r="2.5" />
    <circle class="snow-particle s2 d2" cx="120" cy="0" r="1.5" />
    <circle class="snow-particle s3 d3" cx="180" cy="0" r="2" />
    <circle class="snow-particle s1 d4" cx="250" cy="0" r="3" />
    <circle class="snow-particle s2 d1" cx="320" cy="0" r="1.5" />
    <circle class="snow-particle s3 d5" cx="390" cy="0" r="2" />
    <circle class="snow-particle s1 d2" cx="460" cy="0" r="2.5" />
    <circle class="snow-particle s2 d3" cx="530" cy="0" r="1.5" />
    <circle class="snow-particle s3 d1" cx="610" cy="0" r="2" />
    <circle class="snow-particle s1 d4" cx="680" cy="0" r="3" />
    <circle class="snow-particle s2 d5" cx="750" cy="0" r="1.5" />
  </g>

  <!-- Snow Particles Layer 2 (Smaller, Slower) -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle class="snow-particle s2 d3" cx="80" cy="-50" r="1.5" />
    <circle class="snow-particle s3 d1" cx="160" cy="-50" r="1" />
    <circle class="snow-particle s1 d5" cx="220" cy="-50" r="2" />
    <circle class="snow-particle s2 d2" cx="300" cy="-50" r="1.2" />
    <circle class="snow-particle s3 d4" cx="360" cy="-50" r="1.8" />
    <circle class="snow-particle s1 d1" cx="430" cy="-50" r="1.5" />
    <circle class="snow-particle s2 d5" cx="490" cy="-50" r="2.2" />
    <circle class="snow-particle s3 d2" cx="570" cy="-50" r="1.5" />
    <circle class="snow-particle s1 d3" cx="640" cy="-50" r="1" />
    <circle class="snow-particle s2 d1" cx="720" cy="-50" r="2" />
    <circle class="snow-particle s3 d4" cx="780" cy="-50" r="1.5" />
  </g>

  <!-- Torches -->
  <!-- Left Torch -->
  <g transform="translate(180, 150)">
    <!-- Stick -->
    <rect x="-4" y="0" width="8" height="35" fill="#3E2723" />
    <!-- Coal base -->
    <rect x="-5" y="-5" width="10" height="8" fill="#212121" />
    <!-- Flame Glow -->
    <circle cx="0" cy="-10" r="16" fill="#FF8F00" opacity="0.5" filter="url(#glow)" class="torch-flame" />
    <!-- Flame Inner -->
    <rect x="-3" y="-12" width="6" height="10" fill="#FFC107" class="torch-flame" />
    <rect x="-1" y="-14" width="2" height="6" fill="#FFF8E1" class="torch-flame" />
  </g>
  
  <!-- Right Torch -->
  <g transform="translate(620, 150)">
    <rect x="-4" y="0" width="8" height="35" fill="#3E2723" />
    <rect x="-5" y="-5" width="10" height="8" fill="#212121" />
    <circle cx="0" cy="-10" r="16" fill="#FF8F00" opacity="0.5" filter="url(#glow)" class="torch-flame d1" />
    <rect x="-3" y="-12" width="6" height="10" fill="#FFC107" class="torch-flame d1" />
    <rect x="-1" y="-14" width="2" height="6" fill="#FFF8E1" class="torch-flame d1" />
  </g>

  <!-- Title Section -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="400" y="140" class="title-text">KUSH MAURYA</text>
    
    <!-- Subtitle -->
    <text x="400" y="185" class="subtitle-text">Fullstack Developer · AI Engineer</text>
    
    <!-- Decorative brackets -->
    <text x="170" y="130" class="bracket float">&lt;</text>
    <text x="630" y="130" class="bracket float">&gt;</text>
  </g>

</svg>
