<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300px">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050A1F" />
      <stop offset="50%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#243B55" />
    </linearGradient>

    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>

    <!-- Blocky Aurora Gradient -->
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(34,193,195,0)" />
      <stop offset="30%" stop-color="rgba(45,253,163,0.5)" />
      <stop offset="70%" stop-color="rgba(123,47,247,0.4)" />
      <stop offset="100%" stop-color="rgba(34,193,195,0)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes float-delay {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(4px); }
      }
      @keyframes snow {
        0% { transform: translateY(-20px) translateX(0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(300px) translateX(20px); opacity: 0; }
      }
      @keyframes aurora {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; transform: scale(1); }
        25% { opacity: 0.8; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
        75% { opacity: 0.9; transform: scale(0.98); }
      }
      .star { animation: twinkle 3s infinite ease-in-out; }
      .aurora-block { animation: aurora 6s infinite alternate ease-in-out; }
      .snow-particle { animation: snow 4s infinite linear; }
      .torch-flame { animation: flicker 0.15s infinite alternate; }
      .title-text { 
        font-family: 'Courier New', Courier, monospace; 
        font-weight: 900; 
        font-size: 58px;
        fill: #FFFFFF;
        text-shadow: 6px 6px 0px #3E3E3E, 8px 8px 0px #000;
        animation: float 4s infinite ease-in-out;
      }
      .subtitle-text {
        font-family: 'Courier New', Courier, monospace; 
        font-weight: 700;
        font-size: 20px;
        fill: #A8DADC;
        text-shadow: 2px 2px 0px #000;
        animation: float-delay 4s infinite ease-in-out;
      }
      
      .d1 { animation-delay: -1s; }
      .d2 { animation-delay: -2s; }
      .d3 { animation-delay: -3s; }
      .s1 { animation-duration: 4s; }
      .s2 { animation-duration: 6s; }
      .s3 { animation-duration: 3.5s; }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="800" height="300" fill="url(#skyGrad)" />

  <!-- Blocky Stars -->
  <g fill="#FFF">
    <!-- Static stars -->
    <rect x="50" y="50" width="4" height="4" opacity="0.5"/>
    <rect x="150" y="20" width="2" height="2"/>
    <rect x="250" y="80" width="4" height="4" opacity="0.6"/>
    <rect x="350" y="30" width="2" height="2"/>
    <rect x="450" y="90" width="4" height="4"/>
    <rect x="650" y="40" width="4" height="4" opacity="0.8"/>
    <rect x="750" y="70" width="2" height="2"/>
    
    <!-- Twinkling stars -->
    <rect class="star d1" x="100" y="90" width="4" height="4"/>
    <rect class="star d2" x="200" y="40" width="6" height="6"/>
    <rect class="star d3" x="300" y="110" width="2" height="2"/>
    <rect class="star d1" x="550" y="60" width="4" height="4"/>
    <rect class="star d2" x="600" y="20" width="6" height="6"/>
    <rect class="star d3" x="700" y="100" width="2" height="2"/>
    <rect class="star d1" x="780" y="30" width="4" height="4"/>
  </g>

  <!-- Blocky Aurora -->
  <!-- Instead of smooth waves, we use blocky stepped paths -->
  <g filter="url(#glow)">
    <path class="aurora-block" d="M 0,100 L 50,100 L 50,80 L 100,80 L 100,60 L 150,60 L 150,40 L 200,40 L 200,60 L 300,60 L 300,80 L 400,80 L 400,60 L 500,60 L 500,40 L 600,40 L 600,60 L 700,60 L 700,80 L 800,80 L 800,180 L 0,180 Z" fill="url(#auroraGrad)" />
    <path class="aurora-block d2" d="M 0,120 L 80,120 L 80,100 L 160,100 L 160,80 L 250,80 L 250,100 L 350,100 L 350,80 L 450,80 L 450,100 L 550,100 L 550,80 L 650,80 L 650,100 L 800,100 L 800,200 L 0,200 Z" fill="url(#auroraGrad)" opacity="0.6" />
  </g>

  <!-- Blocky Clouds -->
  <g fill="#FFFFFF" opacity="0.15">
    <!-- Cloud 1 -->
    <rect x="50" y="40" width="100" height="20" />
    <rect x="70" y="20" width="60" height="20" />
    <!-- Cloud 2 -->
    <rect x="600" y="60" width="120" height="20" />
    <rect x="620" y="80" width="80" height="20" />
    <rect x="640" y="40" width="60" height="20" />
    <!-- Cloud 3 -->
    <rect x="350" y="30" width="80" height="15" />
    <rect x="370" y="15" width="40" height="15" />
  </g>

  <!-- Mountains Layer 1 (Distant) - Blocky Style -->
  <!-- Mountain 1 -->
  <path d="M 0,230 L 0,170 L 20,170 L 20,150 L 50,150 L 50,130 L 80,130 L 80,110 L 120,110 L 120,130 L 150,130 L 150,150 L 180,150 L 180,170 L 210,170 L 210,190 L 250,190 L 250,230 Z" fill="#1B263B" />
  <!-- Mountain 2 -->
  <path d="M 200,230 L 200,190 L 230,190 L 230,170 L 260,170 L 260,150 L 300,150 L 300,130 L 340,130 L 340,150 L 380,150 L 380,170 L 410,170 L 410,190 L 450,190 L 450,230 Z" fill="#1B263B" />
  <!-- Mountain 3 -->
  <path d="M 400,230 L 400,190 L 440,190 L 440,170 L 470,170 L 470,150 L 510,150 L 510,130 L 560,130 L 560,150 L 600,150 L 600,170 L 630,170 L 630,190 L 670,190 L 670,230 Z" fill="#1B263B" />
  <!-- Mountain 4 -->
  <path d="M 600,230 L 600,200 L 640,200 L 640,180 L 680,180 L 680,160 L 730,160 L 730,140 L 780,140 L 780,170 L 800,170 L 800,230 Z" fill="#1B263B" />

  <!-- Snow on Mountains (Blocky) -->
  <g fill="#E0E1DD" opacity="0.8">
    <path d="M 50,150 L 50,130 L 80,130 L 80,110 L 120,110 L 120,130 L 150,130 L 150,150 L 120,150 L 120,140 L 80,140 L 80,150 Z" />
    <path d="M 260,170 L 260,150 L 300,150 L 300,130 L 340,130 L 340,150 L 380,150 L 380,170 L 340,170 L 340,160 L 300,160 L 300,170 Z" />
    <path d="M 470,170 L 470,150 L 510,150 L 510,130 L 560,130 L 560,150 L 600,150 L 600,170 L 560,170 L 560,160 L 510,160 L 510,170 Z" />
    <path d="M 680,180 L 680,160 L 730,160 L 730,140 L 780,140 L 780,170 L 750,170 L 750,160 L 710,160 L 710,180 Z" />
  </g>

  <!-- Foreground Land -->
  <!-- Blocky terrain edge -->
  <path d="M 0,220 L 100,220 L 100,215 L 200,215 L 200,220 L 350,220 L 350,215 L 450,215 L 450,220 L 600,220 L 600,210 L 700,210 L 700,220 L 800,220 L 800,270 L 0,270 Z" fill="#141E30" />
  
  <!-- Trees (Blocky Pines) -->
  <g fill="#0F1724">
    <!-- Tree 1 -->
    <rect x="36" y="240" width="8" height="20" /> <!-- Trunk -->
    <rect x="25" y="230" width="30" height="10" />
    <rect x="30" y="220" width="20" height="10" />
    <rect x="35" y="210" width="10" height="10" />
    <!-- Tree 2 -->
    <rect x="126" y="235" width="8" height="20" /> 
    <rect x="110" y="225" width="40" height="10" />
    <rect x="120" y="215" width="20" height="10" />
    <rect x="125" y="205" width="10" height="10" />
    <!-- Tree 3 -->
    <rect x="716" y="230" width="8" height="20" /> 
    <rect x="700" y="220" width="40" height="10" />
    <rect x="710" y="210" width="20" height="10" />
    <rect x="715" y="200" width="10" height="10" />
    <!-- Tree 4 -->
    <rect x="766" y="240" width="8" height="20" /> 
    <rect x="755" y="230" width="30" height="10" />
    <rect x="760" y="220" width="20" height="10" />
    <rect x="765" y="210" width="10" height="10" />
  </g>

  <!-- Snow on Trees (Blocky) -->
  <g fill="#FFF" opacity="0.6">
    <rect x="35" y="210" width="10" height="4" />
    <rect x="30" y="220" width="20" height="4" />
    
    <rect x="125" y="205" width="10" height="4" />
    <rect x="120" y="215" width="20" height="4" />
    
    <rect x="715" y="200" width="10" height="4" />
    <rect x="710" y="210" width="20" height="4" />

    <rect x="765" y="210" width="10" height="4" />
    <rect x="760" y="220" width="20" height="4" />
  </g>

  <!-- Water Reflection at Bottom -->
  <rect x="0" y="270" width="800" height="30" fill="url(#waterGrad)" opacity="0.9"/>
  <!-- Blocky water lines -->
  <g fill="#A8DADC" opacity="0.3">
    <rect x="0" y="275" width="800" height="2" />
    <rect x="50" y="280" width="100" height="2" />
    <rect x="250" y="280" width="150" height="2" />
    <rect x="500" y="280" width="80" height="2" />
    <rect x="700" y="280" width="60" height="2" />
    
    <rect x="120" y="285" width="60" height="2" />
    <rect x="320" y="285" width="120" height="2" />
    <rect x="620" y="285" width="100" height="2" />
  </g>

  <!-- Snow Particles Layer 1 (Blocky squares) -->
  <g fill="#FFFFFF" opacity="0.9">
    <rect class="snow-particle s1 d1" x="40" y="0" width="6" height="6" />
    <rect class="snow-particle s2 d2" x="120" y="0" width="4" height="4" />
    <rect class="snow-particle s3 d3" x="180" y="0" width="5" height="5" />
    <rect class="snow-particle s1 d4" x="250" y="0" width="8" height="8" />
    <rect class="snow-particle s2 d1" x="320" y="0" width="4" height="4" />
    <rect class="snow-particle s3 d1" x="390" y="0" width="5" height="5" />
    <rect class="snow-particle s1 d2" x="460" y="0" width="6" height="6" />
    <rect class="snow-particle s2 d3" x="530" y="0" width="4" height="4" />
    <rect class="snow-particle s3 d1" x="610" y="0" width="5" height="5" />
    <rect class="snow-particle s1 d4" x="680" y="0" width="8" height="8" />
    <rect class="snow-particle s2 d1" x="750" y="0" width="4" height="4" />
  </g>

  <!-- Snow Particles Layer 2 (Smaller) -->
  <g fill="#FFFFFF" opacity="0.5">
    <rect class="snow-particle s2 d3" x="80" y="-50" width="4" height="4" />
    <rect class="snow-particle s3 d1" x="160" y="-50" width="3" height="3" />
    <rect class="snow-particle s1 d1" x="220" y="-50" width="5" height="5" />
    <rect class="snow-particle s2 d2" x="300" y="-50" width="3" height="3" />
    <rect class="snow-particle s3 d4" x="360" y="-50" width="4" height="4" />
    <rect class="snow-particle s1 d1" x="430" y="-50" width="4" height="4" />
    <rect class="snow-particle s2 d1" x="490" y="-50" width="6" height="6" />
    <rect class="snow-particle s3 d2" x="570" y="-50" width="4" height="4" />
    <rect class="snow-particle s1 d3" x="640" y="-50" width="3" height="3" />
    <rect class="snow-particle s2 d1" x="720" y="-50" width="5" height="5" />
    <rect class="snow-particle s3 d4" x="780" y="-50" width="4" height="4" />
  </g>

  <!-- Torches -->
  <!-- Left Torch -->
  <g transform="translate(180, 150)">
    <!-- Stick -->
    <rect x="-4" y="0" width="8" height="35" fill="#3E2723" />
    <!-- Coal base -->
    <rect x="-5" y="-5" width="10" height="8" fill="#212121" />
    <!-- Flame Glow -->
    <rect x="-16" y="-26" width="32" height="32" fill="#FF8F00" opacity="0.4" filter="url(#glow)" class="torch-flame" />
    <!-- Flame Inner -->
    <rect x="-3" y="-12" width="6" height="10" fill="#FFC107" class="torch-flame" />
    <rect x="-1" y="-14" width="2" height="6" fill="#FFF8E1" class="torch-flame" />
  </g>
  
  <!-- Right Torch -->
  <g transform="translate(620, 150)">
    <rect x="-4" y="0" width="8" height="35" fill="#3E2723" />
    <rect x="-5" y="-5" width="10" height="8" fill="#212121" />
    <rect x="-16" y="-26" width="32" height="32" fill="#FF8F00" opacity="0.4" filter="url(#glow)" class="torch-flame d1" />
    <rect x="-3" y="-12" width="6" height="10" fill="#FFC107" class="torch-flame d1" />
    <rect x="-1" y="-14" width="2" height="6" fill="#FFF8E1" class="torch-flame d1" />
  </g>

  <!-- Title Section -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="400" y="140" class="title-text">KUSH MAURYA</text>
    
    <!-- Subtitle -->
    <text x="400" y="185" class="subtitle-text">Fullstack Developer · AI Engineer</text>
  </g>

</svg>
