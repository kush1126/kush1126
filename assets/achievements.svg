<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="220px">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .achievement {
        animation: float 4s infinite ease-in-out;
      }
      .a1 { animation-delay: 0s; }
      .a2 { animation-delay: 1.33s; }
      .a3 { animation-delay: 2.66s; }
      
      .title {
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #FFFF55;
        text-shadow: 2px 2px 0px #3F3F15;
      }
      .desc {
        font-family: 'Courier New', Courier, monospace;
        font-size: 16px;
        fill: #FFFFFF;
        text-shadow: 2px 2px 0px #3F3F3F;
      }
      .icon {
        font-family: 'Segoe UI Emoji', sans-serif;
        font-size: 32px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Container -->
  <g transform="translate(0, 0)">
    
    <!-- Achievement 1: Hackathon Finalist -->
    <g transform="translate(0, 10)" class="achievement a1">
      <rect x="0" y="0" width="300" height="60" fill="#212121" rx="2" />
      <path d="M 0,0 L 300,0 L 298,2 L 2,2 Z" fill="#555555" />
      <path d="M 0,0 L 2,2 L 2,58 L 0,60 Z" fill="#555555" />
      <path d="M 300,60 L 0,60 L 2,58 L 298,58 Z" fill="#000000" />
      <path d="M 300,60 L 298,58 L 298,2 L 300,0 Z" fill="#000000" />
      
      <text x="30" y="42" class="icon">🏆</text>
      <text x="70" y="24" class="title">Achievement get!</text>
      <text x="70" y="46" class="desc">2x Hackathon Finalist</text>
    </g>

    <!-- Achievement 2: Fullstack Developer -->
    <g transform="translate(0, 80)" class="achievement a2">
      <rect x="0" y="0" width="300" height="60" fill="#212121" rx="2" />
      <path d="M 0,0 L 300,0 L 298,2 L 2,2 Z" fill="#555555" />
      <path d="M 0,0 L 2,2 L 2,58 L 0,60 Z" fill="#555555" />
      <path d="M 300,60 L 0,60 L 2,58 L 298,58 Z" fill="#000000" />
      <path d="M 300,60 L 298,58 L 298,2 L 300,0 Z" fill="#000000" />
      
      <text x="30" y="42" class="icon">💻</text>
      <text x="70" y="24" class="title">Achievement get!</text>
      <text x="70" y="46" class="desc">Fullstack &amp; AI Dev</text>
    </g>

    <!-- Achievement 3: Shipped to Prod -->
    <g transform="translate(0, 150)" class="achievement a3">
      <rect x="0" y="0" width="300" height="60" fill="#212121" rx="2" />
      <path d="M 0,0 L 300,0 L 298,2 L 2,2 Z" fill="#555555" />
      <path d="M 0,0 L 2,2 L 2,58 L 0,60 Z" fill="#555555" />
      <path d="M 300,60 L 0,60 L 2,58 L 298,58 Z" fill="#000000" />
      <path d="M 300,60 L 298,58 L 298,2 L 300,0 Z" fill="#000000" />
      
      <text x="30" y="42" class="icon">🚀</text>
      <text x="70" y="24" class="title">Achievement get!</text>
      <text x="70" y="46" class="desc">Shipped to Production</text>
    </g>
    
  </g>
</svg>
