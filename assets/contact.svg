<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280">
  <defs>
    <style>
      @keyframes orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes portalShimmer {
        0%,100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .mc-text { font-family: 'Courier New', monospace; }
      .portal-anim { animation: portalShimmer 2s infinite ease-in-out; }
      .float-icon { animation: float 2.5s infinite ease-in-out; }
      .sign-text { font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #3E2000; }
    </style>
  </defs>

  <!-- Background: Split - Overworld left, Nether right -->
  <rect width="800" height="280" fill="#87CEEB"/>
  <rect x="600" y="0" width="200" height="280" fill="#3D0000"/>
  <rect x="540" y="0" width="60" height="280" fill="#6B0000" opacity="0.7"/>

  <!-- Ground Line -->
  <rect x="0" y="230" width="540" height="50" fill="#5C4033"/>
  <rect x="0" y="220" width="540" height="12" fill="#559335"/>
  <rect x="540" y="230" width="260" height="50" fill="#2A0000"/>
  <rect x="540" y="222" width="260" height="10" fill="#8B0000"/>

  <!-- Overworld clouds -->
  <g fill="white" opacity="0.8">
    <rect x="40" y="30" width="80" height="16"/>
    <rect x="60" y="14" width="40" height="16"/>
    <rect x="200" y="50" width="60" height="16"/>
    <rect x="210" y="34" width="40" height="16"/>
    <rect x="350" y="25" width="70" height="16"/>
    <rect x="365" y="9" width="40" height="16"/>
  </g>

  <!-- Nether netherrack sky detail -->
  <g fill="#550000" opacity="0.4">
    <rect x="620" y="0" width="40" height="30"/>
    <rect x="680" y="0" width="30" height="40"/>
    <rect x="730" y="0" width="50" height="25"/>
  </g>

  <!-- ===== NETHER PORTAL (center-left) ===== -->
  <g transform="translate(210, 60)">
    <!-- Portal Frame (Obsidian - dark purple/black) -->
    <rect x="-8" y="-8" width="96" height="186" fill="#1A0030" rx="2"/>
    <rect x="0" y="0" width="80" height="170" fill="#0D0015" rx="1"/>
    
    <!-- Swirling purple portal inside -->
    <rect x="4" y="4" width="72" height="162" fill="#6400AA" opacity="0.3" rx="1"/>
    <rect x="8" y="8" width="64" height="154" fill="#9B30FF" opacity="0.2" class="portal-anim"/>
    <rect x="12" y="20" width="56" height="130" fill="#CC77FF" opacity="0.15" class="portal-anim" style="animation-delay:0.5s"/>
    <rect x="16" y="35" width="48" height="100" fill="#FF99FF" opacity="0.1" class="portal-anim" style="animation-delay:1s"/>

    <!-- Obsidian frame detail pixels -->
    <rect x="-8" y="-8" width="16" height="16" fill="#250040"/>
    <rect x="80" y="-8" width="16" height="16" fill="#250040"/>
    <rect x="-8" y="170" width="16" height="16" fill="#250040"/>
    <rect x="80" y="170" width="16" height="16" fill="#250040"/>
    
    <!-- Portal label -->
    <text x="40" y="-18" font-family="Courier New,monospace" font-size="11" fill="#CC77FF" text-anchor="middle" font-weight="bold">NETHER PORTAL</text>
  </g>

  <!-- ===== SIGNS for each social/contact ===== -->

  <!-- LinkedIn Sign -->
  <g transform="translate(30, 110)">
    <!-- Sign post -->
    <rect x="18" y="70" width="6" height="50" fill="#5D4037"/>
    <!-- Sign board -->
    <rect x="0" y="40" width="80" height="36" fill="#D4A84B" rx="2"/>
    <rect x="0" y="40" width="80" height="4" fill="#B8902A"/>
    <rect x="0" y="72" width="80" height="4" fill="#8B6914"/>
    <text x="40" y="58" class="sign-text" text-anchor="middle">💼</text>
    <text x="40" y="72" class="sign-text" font-size="10" text-anchor="middle">LinkedIn</text>
  </g>

  <!-- GitHub Sign -->
  <g transform="translate(130, 90)">
    <rect x="18" y="70" width="6" height="70" fill="#5D4037"/>
    <rect x="0" y="40" width="80" height="36" fill="#D4A84B" rx="2"/>
    <rect x="0" y="40" width="80" height="4" fill="#B8902A"/>
    <rect x="0" y="72" width="80" height="4" fill="#8B6914"/>
    <text x="40" y="58" class="sign-text" text-anchor="middle">🐙</text>
    <text x="40" y="72" class="sign-text" font-size="10" text-anchor="middle">GitHub</text>
  </g>

  <!-- Email Sign -->
  <g transform="translate(410, 100)">
    <rect x="18" y="70" width="6" height="60" fill="#5D4037"/>
    <rect x="0" y="40" width="80" height="36" fill="#D4A84B" rx="2"/>
    <rect x="0" y="40" width="80" height="4" fill="#B8902A"/>
    <rect x="0" y="72" width="80" height="4" fill="#8B6914"/>
    <text x="40" y="58" class="sign-text" text-anchor="middle">📧</text>
    <text x="40" y="72" class="sign-text" font-size="10" text-anchor="middle">Email Me</text>
  </g>

  <!-- Twitter/X Sign -->
  <g transform="translate(500, 115)">
    <rect x="18" y="70" width="6" height="45" fill="#5D4037"/>
    <rect x="0" y="40" width="80" height="36" fill="#D4A84B" rx="2"/>
    <rect x="0" y="40" width="80" height="4" fill="#B8902A"/>
    <rect x="0" y="72" width="80" height="4" fill="#8B6914"/>
    <text x="40" y="58" class="sign-text" text-anchor="middle">🐦</text>
    <text x="40" y="72" class="sign-text" font-size="10" text-anchor="middle">Twitter/X</text>
  </g>

  <!-- ===== NETHER SIDE: Burning signs ===== -->
  <!-- Blaze Sign -->
  <g transform="translate(620, 80)">
    <rect x="18" y="70" width="6" height="80" fill="#3E2000"/>
    <rect x="0" y="40" width="80" height="36" fill="#8B2500" rx="2"/>
    <rect x="0" y="40" width="80" height="4" fill="#FF4500" opacity="0.7"/>
    <rect x="0" y="72" width="80" height="4" fill="#5C1500"/>
    <text x="40" y="58" class="sign-text" fill="#FF8C00" text-anchor="middle">🔥</text>
    <text x="40" y="72" class="sign-text" fill="#FF8C00" font-size="10" text-anchor="middle">Hot Projects</text>
  </g>

  <!-- Ghast Sign -->
  <g transform="translate(710, 95)">
    <rect x="18" y="70" width="6" height="65" fill="#3E2000"/>
    <rect x="0" y="40" width="80" height="36" fill="#8B2500" rx="2"/>
    <rect x="0" y="40" width="80" height="4" fill="#FF4500" opacity="0.7"/>
    <rect x="0" y="72" width="80" height="4" fill="#5C1500"/>
    <text x="40" y="58" class="sign-text" fill="#FF8C00" text-anchor="middle">⚡</text>
    <text x="40" y="72" class="sign-text" fill="#FF8C00" font-size="10" text-anchor="middle">Portfolio</text>
  </g>

  <!-- Steve character near the portal -->
  <g transform="translate(340, 130)" class="float-icon">
    <!-- Head -->
    <rect x="0" y="0" width="24" height="24" fill="#F5CBA7"/>
    <rect x="4" y="8" width="6" height="6" fill="#5D4E37"/>  <!-- left eye -->
    <rect x="14" y="8" width="6" height="6" fill="#5D4E37"/> <!-- right eye -->
    <rect x="6" y="17" width="12" height="4" fill="#C0392B"/>   <!-- mouth -->
    <!-- Body (blue shirt) -->
    <rect x="2" y="24" width="20" height="20" fill="#2E86AB"/>
    <!-- Arms -->
    <rect x="-8" y="24" width="8" height="16" fill="#2E86AB"/>
    <rect x="24" y="24" width="8" height="16" fill="#2E86AB"/>
    <!-- Legs -->
    <rect x="2" y="44" width="8" height="16" fill="#1A5276"/>
    <rect x="14" y="44" width="8" height="16" fill="#1A5276"/>
    <!-- Shoes -->
    <rect x="2" y="60" width="8" height="4" fill="#5D4037"/>
    <rect x="14" y="60" width="8" height="4" fill="#5D4037"/>
  </g>

  <!-- BANNER TEXT -->
  <text x="400" y="265" font-family="Courier New,monospace" font-size="15" fill="#FFFF55" text-anchor="middle" font-weight="bold">🌍 Connect with me — I don't bite (unlike Creepers) 💚</text>

</svg>
